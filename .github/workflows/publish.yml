name: Publicación manual GHCR
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar imágenes del commit main después de CI
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ghcr-main
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.publish && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    environment: ghcr-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      GHCR_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar artefactos
        run: |
          (cd apps/api && ./mvnw --batch-mode -DskipTests package)
          (cd apps/web && npm ci && npm run build)
          scripts/build_images.sh
      - name: Publicar únicamente por solicitud manual
        shell: bash
        run: |
          set -euo pipefail
          owner="${GHCR_OWNER,,}"
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for image in web api ml-service mlflow airflow minio; do
            target="ghcr.io/$owner/retailops-$image:$IMAGE_TAG"
            # Rechaza una etiqueta ya existente; una ejecución no sustituye versiones previas.
            if docker manifest inspect "$target" > /dev/null 2> manifest-error.txt; then
              echo "Etiqueta existente: $target" >&2
              exit 1
            fi
            if ! grep -Eq 'manifest unknown|no such manifest' manifest-error.txt; then
              echo "No se pudo demostrar que la etiqueta esté libre: $target" >&2
              exit 1
            fi
            docker tag "retailops-$image:$IMAGE_TAG" "$target"
            docker push "$target"
          done
