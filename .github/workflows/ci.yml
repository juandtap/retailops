name: CI RetailOps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12.16"
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Python bloqueado y pruebas sin infraestructura
        run: |
          uv run --project apps/ml-service --locked pytest apps/ml-service/tests -q
          python scripts/ci/check_dags.py
      - name: Java 21
        working-directory: apps/api
        run: ./mvnw --batch-mode verify
      - name: React
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm run lint
      - name: Herramientas con checksum
        run: python scripts/ci/install_tools.py
      - name: Workflows, Dockerfiles, Compose y Kubernetes
        run: scripts/ci/validate.sh
      - name: Construir imágenes sin publicar
        run: scripts/build_images.sh
      - name: Importar DAGs reales sin datos ni secretos
        run: docker run --rm -i --entrypoint python "retailops-airflow:$IMAGE_TAG" - < scripts/ci/check_dagbag.py
      - name: Conservar manifiestos renderizados
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifests-${{ github.sha }}
          path: .local/f4/rendered.yaml
          retention-days: 7
