spring.application.name=retailops-api
server.address=${API_HOST:127.0.0.1}
server.port=${API_PORT:8080}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Mantenimiento optativo: el proceso web no recibe credenciales de migración.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=false

spring.sql.init.mode=never

# Buckets acotados para latencia HTTP; sin etiquetas por usuario/tienda/familia.
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,250ms,500ms,1s,2s,5s

management.prometheus.metrics.export.enabled=true

# JSON de consola con UTC y correlación MDC; no habilitar wire logging.
logging.structured.format.console=logstash
logging.structured.json.add.service=spring
logging.structured.json.exclude=stack_trace
