[project]
name = "retailops-ml-service"
version = "0.1.0"
description = "Servicio local de inferencia de RetailOps; base de Fase 0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi>=0.115,<1",
    "mlflow>=3.4,<4",
    "pandas>=2.2,<4",
    "prometheus-client>=0.23,<1",
    "psycopg[binary]>=3.3,<4",
    "scikit-learn>=1.7,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
