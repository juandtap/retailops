apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retailops-alertmanager
  namespace: retailops-observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 256Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retailops-alert-receiver
  namespace: retailops-observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 256Mi}
