{{- if .Values.collectionAuthorized }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retailops-log-reader
{{- range $ns := list "retailops" .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retailops-log-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retailops-log-reader
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: retailops-log-reader}
subjects:
  - {kind: ServiceAccount, name: retailops-log-reader, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
