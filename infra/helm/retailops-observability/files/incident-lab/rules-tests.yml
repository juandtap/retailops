        },
        {
          "series": "incident_lab_requests_total{component=\"spring\",status=\"503\"}",
          "values": "0+1x20"
        },
        {
          "series": "incident_lab_request_seconds_bucket{component=\"spring\",le=\"1\"}",
          "values": "0x20"
        },
        {
          "series": "incident_lab_request_seconds_bucket{component=\"spring\",le=\"2\"}",
          "values": "0+5x20"
        },
        {
          "series": "incident_lab_request_seconds_bucket{component=\"spring\",le=\"+Inf\"}",
