global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 25s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api.retailops.svc:8080]
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: [ml-service.retailops.svc:8000]
  - job_name: lab
    static_configs:
      - targets: [collector:8088]
