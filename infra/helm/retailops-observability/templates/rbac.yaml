apiVersion: v1
kind: ServiceAccount
metadata:
  name: retailops-metrics-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: retailops-metrics-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: retailops-metrics-nodes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: retailops-metrics-nodes}
subjects:
  - {kind: ServiceAccount, name: retailops-metrics-reader, namespace: {{ .Release.Namespace }}} 
{{- range $ns := list "retailops" .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retailops-metrics-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retailops-metrics-reader
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: retailops-metrics-reader}
subjects:
  - {kind: ServiceAccount, name: retailops-metrics-reader, namespace: {{ $.Release.Namespace }}}
{{- end }}
