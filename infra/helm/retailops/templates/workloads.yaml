{{- range $name, $port := dict "web" 80 "api" 8080 "ml" 8000 }}
{{- $service := ternary "ml-service" $name (eq $name "ml") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
  ports:
    - {name: http, port: {{ $port }}, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: {{ ternary 0 1 (eq $name "ml") }}, maxUnavailable: {{ ternary 1 0 (eq $name "ml") }}}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
      annotations:
        {{- if eq $name "web" }}
        retailops.local/rollout-marker: {{ $.Values.rolloutMarker | quote }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        {{- if ne $name "web" }}
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.hostAliases }}
      hostAliases: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $name "ml" }}
      # Trainer exige archivo regular 0600: un Secret proyectado es un symlink.
      initContainers:
        - name: trainer-credentials
          image: {{ printf "%s:%s" $.Values.images.ml.repository $.Values.images.ml.tag | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: [python, -c]
          args:
            - "import os,pathlib; p=pathlib.Path('/target/pg_trainer_password'); fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600); os.fchmod(fd,0o600); os.write(fd,pathlib.Path('/source/pg_trainer_password').read_bytes()); os.close(fd)"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: credentials, mountPath: /source, readOnly: true}
            - {name: trainer-private, mountPath: /target}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" (index $.Values.images $name).repository (index $.Values.images $name).tag | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ $port }}}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              {{- if eq $name "web" }}
              # nginx oficial arranca como root y reduce privilegios en workers.
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
              {{- end }}
          {{- if ne $name "web" }}
          envFrom: [{configMapRef: {name: {{ $.Release.Name }}-config}}]
          {{- end }}
          resources: {{ toYaml (index $.Values.resources $name) | nindent 12 }}
          startupProbe:
            httpGet: {path: {{ ternary "/actuator/health/liveness" (ternary "/health" "/" (eq $name "ml")) (eq $name "api") }}, port: http}
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: {path: {{ ternary "/actuator/health/liveness" (ternary "/health" "/" (eq $name "ml")) (eq $name "api") }}, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: {{ ternary "/actuator/health/readiness" (ternary "/model" "/" (eq $name "ml")) (eq $name "api") }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          {{- if ne $name "web" }}
          volumeMounts:
            - name: {{ ternary "credentials" "trainer-private" (eq $name "api") }}
              mountPath: {{ ternary "/run/secrets" "/opt/retailops/.local/secrets" (eq $name "api") }}
              readOnly: true
            {{- if eq $name "ml" }}
            - {name: cache, mountPath: /opt/retailops/.local/mlops}
            {{- end }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ ternary $.Values.secrets.api $.Values.secrets.trainer (eq $name "api") }}
            defaultMode: 0440
            items:
              {{- if eq $name "api" }}
              - {key: pg_api_password, path: pg_api_password}
              - {key: airflow_reader.json, path: airflow_reader.json}
              {{- else }}
              - {key: pg_trainer_password, path: pg_trainer_password}
              {{- end }}
        {{- if eq $name "ml" }}
        - name: trainer-private
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: cache
          persistentVolumeClaim: {claimName: {{ $.Values.cache.existingClaim }}}
        {{- end }}
      {{- end }}
{{- end }}
