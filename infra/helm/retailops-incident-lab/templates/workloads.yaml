{{- if or (ne .Release.Namespace "retailops-incident-lab") (ne .Release.Name "retailops-incident-lab") }}
{{- fail "Release y namespace deben ser retailops-incident-lab, nunca retailops/default" }}
{{- end }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: training-budget
spec:
  hard:
    pods: "3"
    requests.cpu: 300m
    requests.memory: 384Mi
    limits.cpu: "1500m"
    limits.memory: 1Gi
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-runtime
data:
  gateway.py: |
{{ .Files.Get "files/gateway.py" | indent 4 }}
---
# Fuera del ciclo de cambios de estado del controlador; upgrade vuelve a normal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: exercise-control
  labels: {app.kubernetes.io/instance: retailops-incident-lab}
data:
  state.json: '{"mode":"normal","deadline":0}'
{{- range $name, $port := dict "spring" 8080 "ml" 8000 "gateway" 8089 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: retailops-incident-lab}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: retailops-incident-lab, app.kubernetes.io/component: {{ $name }}}
  ports: [{name: http, port: {{ $port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: retailops-incident-lab}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: retailops-incident-lab, app.kubernetes.io/component: {{ $name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: retailops-incident-lab
        app.kubernetes.io/component: {{ $name }}
        retailops.io/ml-client: allowed
      annotations:
        checksum/runtime: {{ $.Files.Get "files/gateway.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ ternary "spring-replica" (ternary "ml-replica" "gateway" (eq $name "ml")) (eq $name "spring") }}
          image: {{ index $.Values.images $name | quote }}
          imagePullPolicy: Never
          ports: [{name: http, containerPort: {{ $port }}}]
          resources: {{ toYaml (index $.Values.resources $name) | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if eq $name "spring" }}
          env: [{name: API_HOST, value: "0.0.0.0"}]
          {{- else if eq $name "ml" }}
          env: [{name: ML_HOST, value: "0.0.0.0"}, {name: ML_PORT, value: "8000"}]
          {{- else }}
          command: [python, /runtime/gateway.py]
          env: [{name: PYTHONDONTWRITEBYTECODE, value: "1"}, {name: PYTHONUNBUFFERED, value: "1"}]
          {{- end }}
          startupProbe:
            httpGet: {path: {{ ternary "/actuator/health" "/health" (eq $name "spring") }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ ternary "/actuator/health" "/health" (eq $name "spring") }}, port: http}
          livenessProbe:
            httpGet: {path: {{ ternary "/actuator/health" "/health" (eq $name "spring") }}, port: http}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $name "gateway" }}
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
            - {name: work, mountPath: /work}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        {{- if eq $name "gateway" }}
        - name: runtime
          configMap: {name: training-runtime}
        - name: control
          configMap: {name: exercise-control}
        - name: work
          emptyDir: {sizeLimit: 1Mi}
        {{- end }}
{{- end }}
