services:
  postgres:
    image: postgres:18.7-alpine@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    entrypoint: [/bin/sh, /tools/postgres-entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailops}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/entrypoint.sh:/tools/postgres-entrypoint.sh:ro
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-retailops.sh:ro
    secrets:
      - pg_admin_password
      - pg_control_password
      - pg_data_password
      - pg_api_password
      - pg_ingestor_password
      - pg_releaser_password
      - pg_trainer_password
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: ${POSTGRES_MEMORY:-1g}
    cpus: ${POSTGRES_CPUS:-2}
    pids_limit: 256
    restart: "no"
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
secrets:
  pg_admin_password:
    file: ../../.local/secrets/pg_admin_password
  pg_control_password:
    file: ../../.local/secrets/pg_control_password
  pg_data_password:
    file: ../../.local/secrets/pg_data_password
  pg_api_password:
    file: ../../.local/secrets/pg_api_password
  pg_ingestor_password:
    file: ../../.local/secrets/pg_ingestor_password
  pg_releaser_password:
    file: ../../.local/secrets/pg_releaser_password
  pg_trainer_password:
    file: ../../.local/secrets/pg_trainer_password
