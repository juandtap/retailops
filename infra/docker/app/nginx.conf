# Sin IP, usuario, URL/query, cookies, referer o user-agent en access log.
log_format retailops escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx","message":"Solicitud HTTP completada","status":$status,"request_id":"$request_id"}';
access_log /dev/stdout retailops;
# Nginx error_log nativo puede incluir URI; limitar a fallos críticos.
error_log /dev/stderr crit;
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Las métricas se recolectan por servicio interno, no por el frontend.
    location ^~ /api/actuator/prometheus { return 404; }
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Content-Type-Options nosniff;
        proxy_intercept_errors off;
    }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
